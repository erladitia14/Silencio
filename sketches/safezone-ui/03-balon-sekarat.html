<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Silencio — Balon Sekarat</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* Custom property yang di-transition WAJIB didaftarkan lewat @property;
     tanpa itu perubahan var() tidak bisa diinterpolasi dan nilainya
     "nyangkut" di angka lama (terukur: vignette tetap .6 saat panic). */
  @property --dark { syntax: "<number>"; inherits: true;  initial-value: 0.6; }
  @property --p    { syntax: "<number>"; inherits: false; initial-value: 1; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #050405; color: #b5a8a4;
    font-family: "IM Fell English", Georgia, serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 28px 16px 60px;
  }
  h1 { font-size: 22px; letter-spacing: .1em; color: #6e5b56; font-style: italic; }
  .sub { font-size: 14px; color: #473d3f; margin: 8px 0 22px; font-style: italic; }

  .screen {
    position: relative; width: min(920px,100%); aspect-ratio: 16/9; overflow: hidden;
    border: 1px solid #1b1416; cursor: pointer;
    background: radial-gradient(ellipse 62% 48% at 50% 44%, #1b1417 0%, #0b0708 58%, #030202 100%);
  }
  .stall {
    position: absolute; inset: 0; opacity: .82;
    background:
      linear-gradient(90deg, transparent 0 19%, #0d0a0b 19% 20.3%, transparent 20.3% 48%,
        #0d0a0b 48% 49.3%, transparent 49.3% 79%, #0d0a0b 79% 80.3%, transparent 80.3%),
      linear-gradient(180deg, transparent 0 61%, #090607 100%);
  }
  .grime {
    position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(#ffffff08 1px, transparent 1.6px);
    background-size: 7px 7px;
    mask-image: radial-gradient(ellipse 70% 56% at 50% 46%, #000 10%, transparent 80%);
  }
  /* Default --dark ditaruh di RULE, bukan inline: inline style menang atas
     selektor [data-state], jadi vignette-nya tidak akan pernah menggelap. */
  .screen { --dark: .6; }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 75% 58% at 50% 50%, transparent 28%, #000 100%);
    opacity: var(--dark,.6); transition: opacity .5s;
  }

  /* ============ HUD: BALON ============ */
  .hud {
    position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%);
    text-align: center; pointer-events: none; width: 42%;
  }
  .stage { position: relative; height: 132px; display: flex; align-items: flex-end; justify-content: center; }

  /* balon mengempis: napas = udara di dalamnya */
  .balloon {
    position: relative;
    width: calc(34px + var(--p,1) * 66px);
    height: calc(40px + var(--p,1) * 78px);
    margin-bottom: 34px;
    border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%;
    background:
      radial-gradient(circle at 34% 28%, #ffffff30 0 8%, transparent 26%),
      linear-gradient(165deg, #a8181d 0%, #6d1014 52%, #380608 100%);
    box-shadow: inset -8px -12px 22px #1a030499, 0 0 26px #6d101433;
    transition: width .3s, height .3s, filter .4s, transform .3s;
    animation: bob 4.6s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1deg) } 50% { transform: translateY(-7px) rotate(1.5deg) } }

  /* simpul + tali */
  .balloon::after {
    content: ""; position: absolute; left: 50%; bottom: -7px; width: 8px; height: 9px;
    transform: translateX(-50%); background: #4d0b0e; border-radius: 0 0 50% 50%;
  }
  .string {
    position: absolute; left: 50%; bottom: 0; width: 1px; height: 34px;
    background: linear-gradient(#5c4a46, transparent);
    transform: translateX(-50%);
  }

  /* kerut karet saat hampir habis */
  .balloon .wrinkle {
    position: absolute; inset: 0; border-radius: inherit; opacity: 0;
    background: repeating-linear-gradient(118deg, #00000055 0 2px, transparent 2px 9px);
    transition: opacity .4s;
  }

  .label {
    font-size: 15px; letter-spacing: .28em; text-transform: uppercase;
    color: #8a7772; text-shadow: 0 0 12px #000; margin-top: 4px;
  }
  .count { font-size: 15px; color: #6a5854; margin-top: 7px; font-style: italic; letter-spacing: .12em; }

  /* ---- keadaan ---- */
  .screen[data-state="warn"]  { --dark:.71; }
  .screen[data-state="warn"]  .balloon { animation-duration: 2.6s; }
  .screen[data-state="warn"]  .label { color: #a58983; }

  .screen[data-state="panic"] { --dark:.84; }
  .screen[data-state="panic"] .balloon { animation-duration: 1.1s; filter: saturate(1.3); }
  .screen[data-state="panic"] .balloon .wrinkle { opacity: .8; }
  .screen[data-state="panic"] .label { color: #c49d95; letter-spacing: .36em; }

  /* BREACH: balon MELETUS — serpihan karet berhamburan */
  .screen[data-state="breach"] { --dark:.95; }
  .screen[data-state="breach"] .balloon { animation: burst .22s ease-out forwards; }
  @keyframes burst { to { transform: scale(1.5); opacity: 0; filter: brightness(2.4) } }
  .screen[data-state="breach"] .string { animation: drop .5s ease-in forwards; }
  @keyframes drop { to { transform: translateX(-50%) translateY(20px); opacity: 0 } }

  .shard { position: absolute; left: 50%; bottom: 74px; width: 7px; height: 11px;
    background: #7d1418; opacity: 0; border-radius: 40% 60% 50% 50%; }
  .screen[data-state="breach"] .shard { animation: fly .95s cubic-bezier(.2,.8,.4,1) forwards; }
  @keyframes fly { 0% { opacity: 1; transform: translate(0,0) rotate(0) }
                 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) } }

  .screen[data-state="breach"] .label {
    color: #a01418; letter-spacing: .5em; animation: flick .11s steps(2) 9;
  }
  @keyframes flick { 50% { opacity: .1 } }

  /* kilat putih sekejap saat meletus */
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .screen[data-state="breach"] .flash { animation: pop .3s ease-out; }
  @keyframes pop { 0% { opacity: .5 } 100% { opacity: 0 } }

  .bar { display: flex; gap: 8px; margin: 20px 0 6px; flex-wrap: wrap; justify-content: center; }
  button {
    font-family: inherit; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    background: #120d0f; color: #8a7873; border: 1px solid #291f22; padding: 9px 15px; cursor: pointer;
    transition: .18s;
  }
  button:hover { background: #1d1417; color: #c9b6b1; border-color: #4a2b30; }
  button.on { background: #3b0f13; color: #e8d6d2; border-color: #7d1418; }
  .hint { font-size: 12.5px; color: #3d3538; margin-top: 12px; font-style: italic; }
</style>
</head>
<body>

<h1>03 · Balon Sekarat</h1>
<p class="sub">Napas = udara di dalam balon. Mengempis perlahan, lalu <em>meletus</em> — dan suara itu memanggilnya.</p>

<div class="screen" id="screen" data-state="calm">
  <div class="stall"></div>
  <div class="grime"></div>
  <div class="flash"></div>
  <div class="vignette"></div>

  <div class="hud">
    <div class="stage" id="stage">
      <div class="balloon" id="balloon" style="--p:1">
        <div class="wrinkle"></div>
      </div>
      <div class="string"></div>
    </div>
    <div class="label" id="label">udara masih ada</div>
    <div class="count" id="count">20</div>
  </div>
</div>

<div class="bar">
  <button data-s="calm" class="on">20s · penuh</button>
  <button data-s="warn">10s · mengempis</button>
  <button data-s="panic">4s · berkerut</button>
  <button data-s="breach">habis · meletus</button>
  <button id="play">▶ jalankan 20 detik</button>
</div>
<p class="hint">Klik layar untuk menjalankan hitungan penuh.</p>

<script>
  const screen  = document.getElementById('screen');
  const balloon = document.getElementById('balloon');
  const stage   = document.getElementById('stage');
  const label   = document.getElementById('label');
  const count   = document.getElementById('count');

  // serpihan karet
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('div');
    s.className = 'shard';
    const a = (i / 14) * Math.PI * 2, d = 60 + Math.random() * 70;
    s.style.setProperty('--dx', (Math.cos(a) * d).toFixed(0) + 'px');
    s.style.setProperty('--dy', (Math.sin(a) * d - 20).toFixed(0) + 'px');
    s.style.setProperty('--rot', (Math.random() * 720 - 360).toFixed(0) + 'deg');
    s.style.animationDelay = (Math.random() * .08).toFixed(2) + 's';
    stage.appendChild(s);
  }

  const TOTAL = 20;
  const TEXT = {
    calm:   'udara masih ada',
    warn:   'karetnya menipis',
    panic:  'jangan sampai pecah',
    breach: 'ia mendengar letusan'
  };

  function render(sec, state) {
    balloon.style.setProperty('--p', Math.max(0, sec / TOTAL));
    screen.dataset.state = state;
    label.textContent = TEXT[state];
    count.textContent = state === 'breach' ? '—' : Math.ceil(sec);
  }

  const PRESET = { calm: 20, warn: 10, panic: 4, breach: 0 };
  let timer = null;

  document.querySelectorAll('[data-s]').forEach(b => {
    b.onclick = () => {
      clearInterval(timer);
      document.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      // reset animasi supaya letusan bisa diputar ulang
      screen.dataset.state = 'calm';
      void screen.offsetWidth;
      render(PRESET[b.dataset.s], b.dataset.s);
    };
  });

  const stateFor = s => s <= 0 ? 'breach' : s <= 5 ? 'panic' : s <= 11 ? 'warn' : 'calm';

  function run() {
    clearInterval(timer);
    document.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    screen.dataset.state = 'calm';
    void screen.offsetWidth;
    let sec = TOTAL;
    render(sec, 'calm');
    timer = setInterval(() => {
      sec -= 0.1;
      if (sec <= 0) { render(0, 'breach'); clearInterval(timer); return; }
      render(sec, stateFor(sec));
    }, 100);
  }
  document.getElementById('play').onclick = run;
  screen.onclick = run;

  render(20, 'calm');
</script>
</body>
</html>
